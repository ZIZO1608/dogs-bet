<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>بوت جديد</title>
  <style>
    body { font-family: system-ui; background: #0f0f1a; color: #fff; margin: 0; }
    .container { max-width: 500px; margin: 2rem auto; background: #1a1a2e; padding: 2rem; border-radius: 12px; }
    input, button { width: 100%; padding: 0.75rem; margin: 0.5rem 0; border-radius: 8px; border: none; }
    button { background: #7c3aed; color: #fff; cursor: pointer; }
    label { display: block; margin-top: 1rem; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <h2>إنشاء بوت جديد</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <label>اسم البوت</label>
      <input name="name" required>
      <label>Bot Token</label>
      <input name="token" required>
      <label>اسم الكاشير (اختياري)</label>
      <input name="cashier_user">
      <label>كلمة مرور الكاشير (اختياري)</label>
      <input name="cashier_pass" type="password">
      <label><input type="checkbox" name="generate" value="1"> توليد كاشير تلقائي</label>
      <button type="submit">إنشاء</button>
    </form>
    <p><a href="/bots" style="color:#a78bfa">رجوع</a></p>
  </div>
</body>
</html>
