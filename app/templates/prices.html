<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الأسعار</title>
  <style>
    body { font-family: system-ui; background: #0f0f1a; color: #fff; margin: 0; }
    .container { max-width: 700px; margin: 2rem auto; }
    .card { background: #1a1a2e; padding: 1.5rem; border-radius: 12px; margin: 1rem 0; }
    input, button { width: 100%; padding: 0.75rem; margin: 0.4rem 0; border-radius: 8px; border: none; }
    button { background: #7c3aed; color: #fff; cursor: pointer; }
    label { display: block; margin-top: 0.8rem; font-size: 0.9rem; }
    .ok { color: #4ade80; }
    a { color: #a78bfa; }
  </style>
</head>
<body>
  <div class="container">
    <h2>أسعار الصرف والحدود</h2>
    <p>هذه الصفحة متاحة للمالك وللكاشير.</p>
    {% if request.query_params.get('saved') %}<p class="ok">تم الحفظ</p>{% endif %}
    <form method="post">
      <div class="card">
        <label>سعر الدولار (SYP لكل 1 USD)</label>
        <input name="syp_rate" type="number" step="1" value="{{ settings.syp_rate }}">
        <label>أدنى شحن</label>
        <input name="min_deposit" type="number" value="{{ settings.min_deposit }}">
        <label>أعلى شحن</label>
        <input name="max_deposit" type="number" value="{{ settings.max_deposit }}">
        <label>أدنى سحب</label>
        <input name="min_withdraw" type="number" value="{{ settings.min_withdraw }}">
        <label>أعلى سحب</label>
        <input name="max_withdraw" type="number" value="{{ settings.max_withdraw }}">
        <label>نسبة رسوم السحب %</label>
        <input name="withdraw_fee" type="number" value="{{ settings.withdraw_fee }}">
      </div>
      <button type="submit">حفظ الأسعار</button>
    </form>
    <p><a href="/">رجوع</a></p>
  </div>
</body>
</html>
