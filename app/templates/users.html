<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>المستخدمين</title>
  <style>
    body { font-family: system-ui; background: #0f0f1a; color: #fff; margin: 0; }
    .container { padding: 2rem; }
    table { width: 100%; border-collapse: collapse; background: #1a1a2e; }
    th, td { padding: 0.75rem; text-align: right; border-bottom: 1px solid #333; }
    a { color: #a78bfa; }
  </style>
</head>
<body>
  <div class="container">
    <h2>المستخدمين</h2>
    <table>
      <tr><th>المستخدم</th><th>الرصيد</th><th>الحالة</th><th>اللغة</th></tr>
      {% for u in users %}
      <tr>
        <td>{{ u.username }}</td>
        <td>{{ u.balance }}</td>
        <td>{{ u.status }}</td>
        <td>{{ u.lang }}</td>
      </tr>
      {% endfor %}
    </table>
    <p><a href="/">رجوع</a></p>
  </div>
</body>
</html>
