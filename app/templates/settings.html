<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إعدادات المالك</title>
  <style>
    body { font-family: system-ui; background: #0f0f1a; color: #fff; margin: 0; }
    .container { max-width: 700px; margin: 2rem auto; }
    .card { background: #1a1a2e; padding: 1.5rem; border-radius: 12px; margin: 1rem 0; }
    input, button { width: 100%; padding: 0.75rem; margin: 0.4rem 0; border-radius: 8px; border: none; }
    button { background: #7c3aed; color: #fff; cursor: pointer; }
    label { display: block; margin-top: 0.8rem; font-size: 0.9rem; }
    .ok { color: #4ade80; }
    a { color: #a78bfa; }
  </style>
</head>
<body>
  <div class="container">
    <h2>إعدادات المالك</h2>
    {% if request.query_params.get('saved') %}<p class="ok">تم الحفظ</p>{% endif %}
    <form method="post">
      <div class="card">
        <h3>ShamCash Secrets</h3>
        <p>الكاشير لا يرى هذه الصفحة.</p>
        <label>Secret 1</label>
        <input name="shamcash_secret1" value="{{ settings.shamcash_secret1 }}">
        <label>Secret 2</label>
        <input name="shamcash_secret2" value="{{ settings.shamcash_secret2 }}">
        <label>Secret 3</label>
        <input name="shamcash_secret3" value="{{ settings.shamcash_secret3 }}">
      </div>
      <button type="submit">حفظ</button>
    </form>
    <p><a href="/">رجوع</a></p>
  </div>
</body>
</html>
